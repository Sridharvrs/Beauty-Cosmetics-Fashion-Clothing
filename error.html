
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | Stackly</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/error.css">
</head>

<body class="pg-error">

  <main class="error-page">

    <!-- BACKGROUND DECORATION -->
    <div class="error-orb orb-one"></div>
    <div class="error-orb orb-two"></div>

    <!-- BRAND -->
    <!-- <a class="logo" href="index.html">
      <img src="images/logo.webp" alt="Stackly Logo">
    </a> -->

    <!-- ERROR CONTENT -->
    <section class="error-content">

      <div class="error-icon">
        <i class="fa-solid fa-compass"></i>
      </div>

      <span class="error-label">
        <i class="fa-solid fa-sparkles"></i>
        OOPS! SOMETHING WENT WRONG
      </span>

      <h1>
        Lost in a world<br>
        of <em>possibilities?</em>
      </h1>

      <div class="error-number">404</div>

      <p class="error-description">
        The page you're looking for seems to have wandered
        somewhere else. Don't worry, there's always
        something beautiful waiting to be discovered.
      </p>

      <!-- ACTION BUTTONS -->
      <div class="error-actions">

        <a href="index.html" class="error-home">
          <i class="fa-solid fa-house"></i>
          Back to Home
        </a>

        <button type="button" class="error-back" id="goBack">
          <i class="fa-solid fa-arrow-left"></i>
          Go Back
        </button>

      </div>

      <div class="error-divider"></div>

      <div class="error-bottom">
        <span>© 2026 Stackly. All rights reserved.</span>
        <span>BEAUTY · FASHION · LIFESTYLE</span>
      </div>

    </section>

  </main>

  <script>
    document.getElementById("goBack").addEventListener("click", () => {

      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }

    });
  </script>

</body>
</html>
